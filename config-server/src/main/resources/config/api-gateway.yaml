spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8087/realms/fitness-oauth2/protocol/openid-connect/certs
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 60
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
#              filters:
#                - name: RequestRateLimiter
#                  args:
#                    key-resolver: "#{@userKeyResolver}"
#                    redis-rate-limiter.replenishRate: 2
#                    redis-rate-limiter.burstCapacity: 2
#                    redis-rate-limiter.requestedTokens: 60
            - id: activity-service
              uri: lb://ACTIVITY-SERVICE
              predicates:
                - Path=/api/activities/**
            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/recommendations/**
#  data:
#    redis:
#      host: localhost
#      port: 6379
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

