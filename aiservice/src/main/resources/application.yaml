spring:
  application:
    name: ai-service
  mongodb:
    uri: mongodb://root:rootpass@localhost:27017/?authSource=admin
    database: fitnessactivity
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Without this, a failing listener nacks with requeue and Rabbit redelivers
        # the same message in a tight loop. Reject and drop instead.
        default-requeue-rejected: false

server:
  port: 8083

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}